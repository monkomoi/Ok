model_id: "astra_tcn_causal_v1"
architecture: "TCN"
version: "1.0.0"
role: "ENSEMBLE_SECONDARY_ON_DEVICE"
target_device: "Samsung Galaxy S7 Edge (arm64-v8a, 4GB RAM, API 30)"
input:
  lookback_length: 64
  feature_count: 26
  dtype: "float32"
network:
  channels: 32
  kernel_size: 3
  dilations: [1, 2, 4, 8]
  causal_padding: true
  dropout: 0.10
  pooling: "last_step_and_avg"
heads:
  horizons: ["15m", "1h", "4h"]
training:
  optimizer: "AdamW"
  learning_rate: 0.0012
  weight_decay: 0.0005
  batch_size: 64
  max_epochs: 30
quantization:
  mode: "DYNAMIC_RANGE_INT8_AND_FP16"
  cpu_threads_s7_edge: 2
