model_id: "astra_lstm_challenger_v1"
architecture: "LSTM"
version: "1.0.0"
role: "CHALLENGER_OFFLINE_AND_ON_DEVICE_EVAL"
target_device: "Samsung Galaxy S7 Edge (arm64-v8a, 4GB RAM, API 30)"
input:
  lookback_length: 64
  feature_count: 26
  dtype: "float32"
network:
  lstm_layers: 1
  hidden_size: 48
  dropout: 0.15
  dense_bottleneck: 32
heads:
  horizons: ["15m", "1h", "4h"]
training:
  optimizer: "AdamW"
  learning_rate: 0.001
  weight_decay: 0.0005
  batch_size: 64
  max_epochs: 35
selection_rule:
  promote_over_gru_only_if: "Net_OOS_Sharpe_and_ECE_beat_GRU_with_latency_increase_le_20pct"
